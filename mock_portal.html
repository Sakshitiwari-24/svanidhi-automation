<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PM Swanidhi Portal - Beneficiary Data Entry (Mock)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 650px;
            margin: 30px auto;
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            border: 1px solid #e1e8ed;
            overflow: hidden;
        }
        .header {
            background: #1a4f8b;
            color: white;
            padding: 16px 24px;
            border-bottom: 3px solid #f39c12;
        }
        .header h2 {
            margin: 0;
            font-size: 1.25rem;
            font-weight: 600;
        }
        .header p {
            margin: 4px 0 0 0;
            font-size: 0.85rem;
            opacity: 0.9;
        }
        .form-body {
            padding: 24px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 0.9rem;
            color: #2c3e50;
        }
        .required {
            color: #e74c3c;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ced4da;
            border-radius: 4px;
            font-size: 0.95rem;
            box-sizing: border-box;
            transition: border-color 0.15s ease-in-out;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #1a4f8b;
            box-shadow: 0 0 0 2px rgba(26, 79, 139, 0.2);
        }
        .btn-submit {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }
        .btn-submit:hover {
            background-color: #219150;
        }
        .alert {
            padding: 14px 18px;
            border-radius: 4px;
            margin-top: 20px;
            font-size: 0.95rem;
            display: none;
        }
        .alert-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .alert-error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .badge {
            display: inline-block;
            background: #e9ecef;
            color: #495057;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            margin-left: 8px;
        }
        .test-controls {
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px dashed #ced4da;
            font-size: 0.85rem;
            color: #6c757d;
        }
        .test-controls label {
            font-weight: normal;
            display: inline-flex;
            align-items: center;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>PM SVANidhi Portal - Beneficiary Data Entry</h2>
        <p>Official Government Beneficiary Verification System (Mock for Testing)</p>
    </div>

    <div class="form-body">
        <!-- Success banner -->
        <div id="successMessage" class="alert alert-success">
            <strong>Success!</strong> Record saved successfully. Reference has been recorded in the database.
        </div>

        <!-- Error banner -->
        <div id="errorMessage" class="alert alert-error">
            <strong>Error!</strong> Submission rejected: simulated portal error.
        </div>

        <form id="entryForm" onsubmit="handleFormSubmit(event)">
            <div class="form-group">
                <label for="applicantName">
                    Applicant Name <span class="required">*</span>
                    <span class="badge">Text</span>
                </label>
                <input type="text" id="applicantName" name="applicantName" placeholder="Enter full name as per records" required autocomplete="off">
            </div>

            <div class="form-group">
                <label for="refNumber">
                    Reference Number <span class="required">*</span>
                    <span class="badge">Numeric / Text</span>
                </label>
                <input type="text" id="refNumber" name="refNumber" placeholder="Enter application reference number" required autocomplete="off">
            </div>

            <button type="submit" id="btnSubmit" class="btn-submit">Submit Record</button>
        </form>

        <div class="test-controls">
            <strong>Test Simulation Controls:</strong><br>
            <label>
                <input type="checkbox" id="chkSimulateFailure"> Simulate Portal Server Error on Submit (for testing failure handling)
            </label>
        </div>
    </div>
</div>

<script>
    function handleFormSubmit(e) {
        e.preventDefault();
        var name = document.getElementById('applicantName').value;
        var ref = document.getElementById('refNumber').value;
        var simulateFailure = document.getElementById('chkSimulateFailure').checked;

        var successDiv = document.getElementById('successMessage');
        var errorDiv = document.getElementById('errorMessage');

        successDiv.style.display = 'none';
        errorDiv.style.display = 'none';

        if (simulateFailure) {
            errorDiv.style.display = 'block';
            return;
        }

        // Simulate successful database record creation
        successDiv.style.display = 'block';
        
        // Disable submit button temporarily to prevent double submission
        document.getElementById('btnSubmit').disabled = true;
    }

    function resetForm() {
        document.getElementById('entryForm').reset();
        document.getElementById('successMessage').style.display = 'none';
        document.getElementById('errorMessage').style.display = 'none';
        document.getElementById('btnSubmit').disabled = false;
    }
</script>

</body>
</html>
